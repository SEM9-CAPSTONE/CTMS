map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $ctms_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 50m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  include /etc/nginx/snippets/ctms-locations.conf;
}
