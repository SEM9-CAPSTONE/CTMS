map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $ctms_forwarded_proto {
  default $scheme;
  https https;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 50m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /mobile {
    absolute_redirect off;
    return 301 /mobile/;
  }

  location ^~ /mobile/ {
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Always revalidate PWA entrypoints and metadata so browsers and iOS Home Screen PWAs
    # pick up new Flutter Web deployments immediately on reload or relaunch.
    location ~* ^/mobile/(?:index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }

    # Flutter Web bundles such as main.dart.js and manifests are not filename-hashed by default;
    # requiring ETag/Last-Modified revalidation prevents mixed-version asset errors after deploys.
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /mobile/index.html;
  }

  include /etc/nginx/snippets/ctms-locations.conf;
}
