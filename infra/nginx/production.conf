map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Accept HTTPS information from a separately configured TLS tunnel/proxy.
map $http_x_forwarded_proto $ctms_forwarded_proto {
  default $scheme;
  https https;
}

# HTTP is private to CTMS's Docker network and the host's loopback interface.
# Public HTTPS must be supplied separately; do not edit the host web server.
server {
  listen 80 default_server;
  server_name ditrek.io.vn;
  client_max_body_size 50m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  include /etc/nginx/snippets/ctms-locations.conf;
}

server {
  listen 80;
  server_name www.ditrek.io.vn;
  return 301 https://ditrek.io.vn$request_uri;
}
