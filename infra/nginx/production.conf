map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name ditrek.io.vn www.ditrek.io.vn;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://ditrek.io.vn$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name www.ditrek.io.vn;

  ssl_certificate /etc/letsencrypt/live/ditrek.io.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ditrek.io.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://ditrek.io.vn$request_uri;
}

server {
  listen 443 ssl;
  server_name ditrek.io.vn;

  ssl_certificate /etc/letsencrypt/live/ditrek.io.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ditrek.io.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 50m;

  include /etc/nginx/snippets/ctms-locations.conf;
}
