# HTTP only while Certbot obtains the first certificate.
server {
  listen 80;
  server_name ditrek.io.vn www.ditrek.io.vn;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    default_type text/plain;
    return 503 "CTMS HTTPS setup in progress.\n";
  }
}
