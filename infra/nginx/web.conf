server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Missing build assets must not return the SPA's HTML as JavaScript.
  location /assets/ {
    try_files $uri =404;
  }

  # PDF.js uses an ES module worker; nginx 1.27's default MIME map omits mjs.
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
