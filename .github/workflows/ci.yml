name: CI Verification

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Node workspaces
        run: pnpm lint:all

      - name: Build Node workspaces
        run: pnpm build:all

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: pip install -r services/ai/requirements.txt

      - name: Validate AI service import
        run: python -m compileall services/ai/app
