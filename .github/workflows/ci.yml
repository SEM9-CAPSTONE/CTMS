name: CI Verification

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Node workspaces
        run: pnpm lint:all

      - name: Build Node workspaces
        run: pnpm build:all

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: pip install -r services/ai/requirements.txt

      - name: Validate AI service import
        run: python -m compileall services/ai/app

      - name: Test survival answer provider contract
        working-directory: services/ai
        run: python -m pytest app/test_survival_answers.py app/test_survival_answers_policy.py app/test_feedback_investigation.py -q

  web-production:
    name: Production Web Runtime Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Install test browser
        run: pnpm --filter @ctms/web exec playwright install --with-deps chromium
      - name: Build the production web image
        run: >-
          docker build -f infra/docker/web.Dockerfile -t ctms-web-runtime-check
          --build-arg VITE_API_BASE_URL=http://127.0.0.1:4175/api
          --build-arg VITE_MAPTILER_API_KEY=build-check .
      - name: Check worker assets through Nginx and draw a route
        env:
          CTMS_WEB_TEST_URL: http://127.0.0.1:4175
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ctms-web-runtime-check -p 127.0.0.1:4175:80 ctms-web-runtime-check
          trap 'docker rm -f ctms-web-runtime-check' EXIT
          docker exec ctms-web-runtime-check nginx -t
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4175/ >/dev/null
          for pattern in 'maplibre-gl-worker-*.js' 'pdf.worker.min-*.mjs'; do
            asset=$(docker exec ctms-web-runtime-check find /usr/share/nginx/html/assets -name "$pattern" -type f -print -quit)
            test -n "$asset"
            headers=$(curl --fail --silent --show-error --dump-header - --output /dev/null "http://127.0.0.1:4175/assets/${asset##*/}")
            printf '%s\n' "$headers" | grep -Eiq '^content-type: (application|text)/javascript'
          done
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4175/assets/missing-worker.mjs)
          test "$status" = 404
          pnpm --filter @ctms/web exec playwright test --config playwright.loading.config.ts

  survival-answer-api:
    name: Survival Answers API Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://ctms:ctms@127.0.0.1:55451/ctms_test
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: ctms_test
          POSTGRES_USER: ctms
          POSTGRES_PASSWORD: ctms
        ports:
          - 55451:5432
        options: >-
          --health-cmd "pg_isready -U ctms -d ctms_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ctms/api exec jest --runInBand ai-answers ai-investigations rag knowledge-chunks
      - run: pnpm --filter @ctms/api test:integration ai-investigations.integration-spec.ts ai-feedback.integration-spec.ts knowledge-chunks.integration-spec.ts survival-documents.integration-spec.ts auth.login.integration-spec.ts auth.refresh.integration-spec.ts
      - run: pnpm --filter @ctms/api test:e2e ai-investigations.e2e-spec.ts ai-answers.e2e-spec.ts survival-documents.e2e-spec.ts

  survival-answer-mobile:
    name: Camper AI Chat Widget Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub test/features/camper/survival_chat_test.dart
