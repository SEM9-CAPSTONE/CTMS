# Used with docker-compose.yml and docker-compose.prod.yml for registry deployments.
services:
  api:
    build: !reset null
    image: docker.io/${CTMS_IMAGE_NAMESPACE:?Set CTMS_IMAGE_NAMESPACE}/ctms-api:${CTMS_IMAGE_TAG:?Set CTMS_IMAGE_TAG}

  basemap-worker:
    build: !reset null
    image: docker.io/${CTMS_IMAGE_NAMESPACE:?Set CTMS_IMAGE_NAMESPACE}/ctms-api:${CTMS_IMAGE_TAG:?Set CTMS_IMAGE_TAG}

  web:
    build: !reset null
    image: docker.io/${CTMS_IMAGE_NAMESPACE:?Set CTMS_IMAGE_NAMESPACE}/ctms-web:${CTMS_IMAGE_TAG:?Set CTMS_IMAGE_TAG}

  ai:
    build: !reset null
    image: docker.io/${CTMS_IMAGE_NAMESPACE:?Set CTMS_IMAGE_NAMESPACE}/ctms-ai:${CTMS_IMAGE_TAG:?Set CTMS_IMAGE_TAG}

  ingestion:
    build: !reset null
    image: docker.io/${CTMS_IMAGE_NAMESPACE:?Set CTMS_IMAGE_NAMESPACE}/ctms-ingestion:${CTMS_IMAGE_TAG:?Set CTMS_IMAGE_TAG}
