services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ctms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctms}
      POSTGRES_USER: ${POSTGRES_USER:-ctms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctms}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctms} -d ${POSTGRES_DB:-ctms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ctms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: ctms-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ctms-api
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://ctms:ctms@postgres:5432/ctms
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:-change-me}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_RESEND_MAX_ATTEMPTS: ${OTP_RESEND_MAX_ATTEMPTS:-5}
      OTP_RESEND_WINDOW_MINUTES: ${OTP_RESEND_WINDOW_MINUTES:-1440}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      ROUTE_SAFETY_APPROVED_SOURCES: ${ROUTE_SAFETY_APPROVED_SOURCES:-}
      ROUTE_SAFETY_PROXIMITY_METERS: ${ROUTE_SAFETY_PROXIMITY_METERS:-300}
      ROUTE_SAFETY_CURRENT_AGE_MINUTES: ${ROUTE_SAFETY_CURRENT_AGE_MINUTES:-360}
      ROUTE_SAFETY_INCIDENT_AGE_MINUTES: ${ROUTE_SAFETY_INCIDENT_AGE_MINUTES:-1440}
      ROUTE_SAFETY_LIVE_ENABLED: ${ROUTE_SAFETY_LIVE_ENABLED:-true}
      ROUTE_SAFETY_LIVE_TIMEOUT_MS: ${ROUTE_SAFETY_LIVE_TIMEOUT_MS:-12000}
      ROUTE_SAFETY_NCHMF_BASE_URL: ${ROUTE_SAFETY_NCHMF_BASE_URL:-https://luquetsatlo.nchmf.gov.vn}
      ROUTE_SAFETY_NCHMF_BOUNDARIES_URL: ${ROUTE_SAFETY_NCHMF_BOUNDARIES_URL:-https://geosllq.vndss.com/geoserversllq/ows}
      ROUTE_SAFETY_VNDMS_ENABLED: ${ROUTE_SAFETY_VNDMS_ENABLED:-true}
      ROUTE_SAFETY_VNDMS_BASE_URL: ${ROUTE_SAFETY_VNDMS_BASE_URL:-https://vndms.gov.vn}
      ROUTE_SAFETY_WATER_ENABLED: ${ROUTE_SAFETY_WATER_ENABLED:-true}
      ROUTE_SAFETY_OVERPASS_URL: ${ROUTE_SAFETY_OVERPASS_URL:-https://overpass.private.coffee/api/interpreter}
      ROUTE_SAFETY_OSM_MAP_URL: ${ROUTE_SAFETY_OSM_MAP_URL:-https://api.openstreetmap.org/api/0.6/map.json}
      ROUTE_SAFETY_CONTEXT_TIMEOUT_MS: ${ROUTE_SAFETY_CONTEXT_TIMEOUT_MS:-20000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    container_name: ctms-ai
    environment:
      AI_SERVICE_PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ctms-web
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_WS_URL: ws://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: ctms-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - ai

volumes:
  postgres-data:
  redis-data:
