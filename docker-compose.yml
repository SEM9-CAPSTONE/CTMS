services:
  postgres:
    image: postgres:16-alpine
    container_name: ctms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctms}
      POSTGRES_USER: ${POSTGRES_USER:-ctms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctms}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctms} -d ${POSTGRES_DB:-ctms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ctms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: ctms-api
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://ctms:ctms@postgres:5432/ctms
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET:-change-me}
      # CTMS-02: account verification OTP (BR-006 expiry, BR-007 resend limit).
      # Same development defaults as .env.example — without these, issueOtp()
      # reads undefined -> NaN and silently breaks BR-220/BR-006 (Known Bug,
      # Step 4/6/8 review). Not previously set here; added now per Step 8
      # final verification (task 1).
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      OTP_RESEND_MAX_ATTEMPTS: ${OTP_RESEND_MAX_ATTEMPTS:-5}
      OTP_RESEND_WINDOW_MINUTES: ${OTP_RESEND_WINDOW_MINUTES:-1440}
      # Real OTP delivery (phone via Twilio, email via Resend). Empty by
      # default is fine for the container to boot; only a live send needs
      # real values supplied via the host's .env.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # CTMS-03: login token lifetimes (BR-009).
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    container_name: ctms-ai
    environment:
      AI_SERVICE_PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: ctms-web
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
      VITE_WS_URL: ws://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: ctms-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - ai

volumes:
  postgres-data:
  redis-data:
