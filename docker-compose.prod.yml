# Docker Compose >= 2.24.4. Use together with docker-compose.yml.
# Usage: bash scripts/deploy-production.sh help.
# Shared VPS: leave the existing host web server and ports 80/443 untouched.
name: ditrek-prod

services:
  postgres:
    container_name: !reset null
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    ports: !reset []

  redis:
    container_name: !reset null
    restart: unless-stopped
    ports: !reset []

  adminer:
    container_name: !reset null
    profiles: [tools]
    ports: !reset []

  api:
    container_name: !reset null
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the internal PostgreSQL URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      API_PUBLIC_URL: https://ditrek.io.vn
      UPLOAD_ROOT: /var/lib/ctms/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: https://ditrek.io.vn/trips
      PAYOS_CANCEL_URL: https://ditrek.io.vn/trips
    ports: !reset []
    volumes:
      - upload-data:/var/lib/ctms/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  basemap-worker:
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the internal PostgreSQL URL in .env.production}

  ai:
    container_name: !reset null
    restart: unless-stopped
    ports: !reset []

  ingestion:
    container_name: !reset null
    restart: unless-stopped
    ports: !reset []

  web:
    container_name: !reset null
    restart: unless-stopped
    build:
      args:
        VITE_API_BASE_URL: https://ditrek.io.vn/api
    ports: !reset []

  nginx:
    container_name: !reset null
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${CTMS_HTTP_PORT:-18080}:80"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  upload-data:
