name: ctms-tests

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ctms_test
      POSTGRES_USER: ctms
      POSTGRES_PASSWORD: ctms
    ports:
      - "127.0.0.1:55451:5432"
    # Disposable test data; never mount the application's postgres-data volume.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ctms -d ctms_test"]
      interval: 2s
      timeout: 5s
      retries: 30
